services:
  leetcode-api:
    image: alfaarghya/alfa-leetcode-api:2.0.4
    ports:
      - "3001:3000"
    restart: unless-stopped

  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_data:/piston
    environment:
      - PISTON_RUN_TIMEOUT=8000
    restart: unless-stopped

volumes:
  piston_data:
